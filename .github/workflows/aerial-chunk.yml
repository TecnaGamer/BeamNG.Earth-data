# One build job of the aerial workflow (aerial.yml) and its upload, called once per matrix entry (a job's packs reach
# the bucket as soon as it is done; artifacts never hold more than ~20 jobs' output).
#   build:  NO secrets: tools/build_aerial_packs.py builds the chunk's cells one after the other (none started after the
#           time budget) into an artifact: the packs and, for each cell built whole, its fragment.
#   upload: the R2 secrets; runs only tools/aerial_ci.py check (anything not a pack of this generation or a fragment
#           rejects the whole artifact; a cell is uploaded only with every pack its fragment lists) and aws-cli: the
#           packs first, the fragments (the cells' done markers) after them; then deletes the artifact.
name: aerial-chunk

on:
  workflow_call:
    inputs:
      id: {type: string, required: true}
      cells: {type: string, required: true}
      set: {type: string, required: true}
      gen: {type: string, required: true}
      ratio: {type: string, default: "1.0"}
      ratio_corr: {type: string, default: "1.3"}
      workers: {type: string, default: "6"}
      dry_run: {type: boolean, default: false}
    secrets:
      R2_ACCOUNT_ID: {required: false}
      R2_ACCESS_KEY_ID: {required: false}
      R2_SECRET_ACCESS_KEY: {required: false}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    permissions:
      contents: read
    outputs:
      artifact: ${{ steps.art.outputs.artifact-id }}
    steps:
      - name: Inputs
        env:
          CELLS: ${{ inputs.cells }}
          SET: ${{ inputs.set }}
          GEN: ${{ inputs.gen }}
          RATIO: ${{ inputs.ratio }}
          RATIO_CORR: ${{ inputs.ratio_corr }}
          WORKERS: ${{ inputs.workers }}
        run: |
          [[ "$CELLS" =~ ^[0-9]+,[0-9]+(\ [0-9]+,[0-9]+)*$ && "$SET" =~ ^[a-z]{2}(_[a-z]+)?_T[0-9a-z]+$ && "$GEN" =~ ^[0-9]+$ \
             && "$RATIO" =~ ^[0-9.]+$ && "$RATIO_CORR" =~ ^[0-9.]+$ && "$WORKERS" =~ ^[1-9][0-9]?$ ]]
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262   # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065   # v5
        with:
          python-version: "3.12"
      # (pinned: Pillow's wheels carry libavif with aom, rasterio's GDAL)
      - run: pip install -q "numpy==2.3.4" "pillow==13.0.0" "rasterio==1.5.2"
      - name: Build the chunk's cells
        timeout-minutes: 330
        env:
          CELLS: ${{ inputs.cells }}
          SET: ${{ inputs.set }}
          GEN: ${{ inputs.gen }}
          RATIO: ${{ inputs.ratio }}
          RATIO_CORR: ${{ inputs.ratio_corr }}
          WORKERS: ${{ inputs.workers }}
        run: |
          set -uo pipefail
          DEADLINE=$(( $(date +%s) + 300 * 60 ))      # (no cell started after 5 h: a cell takes ~2-6 min)
          ( while sleep 300; do
              echo "[mon] load $(cut -d' ' -f1-3 /proc/loadavg), rx $(awk 'NR > 2 && $1 !~ /^lo:/ {s += $2} END {print int(s / 1e6)}' /proc/net/dev) MB, $(free -m | awk '/Mem/ {print $3}') MB used, $(df -m . | awk 'NR == 2 {print $4}') MB free"
            done ) &
          MON=$!
          trap 'kill $MON 2>/dev/null || true' EXIT
          mkdir -p out
          ok=0; failed=0; left=0
          for c in $CELLS; do
            if [ "$(date +%s)" -gt "$DEADLINE" ]; then left=$((left + 1)); continue; fi
            python tools/build_aerial_packs.py out --packs "aerial/sets/$SET.npz" --only-cells "$c" --gen "$GEN" \
              --res-ratio "$RATIO" --res-ratio-corr "$RATIO_CORR" --workers "$WORKERS" --fragments --deadline "$DEADLINE" \
              | tee -a cells.jsonl
            st=${PIPESTATUS[0]}
            if [ "$st" -eq 0 ]; then ok=$((ok + 1)); elif [ "$st" -eq 75 ]; then left=$((left + 1)); else
              failed=$((failed + 1)); echo "::warning::cell $c: builder status $st (built again next run)"
              rm -f "out/_cells/${c/,/_}.json"
            fi
          done
          echo "chunk ${{ inputs.id }}: $ok cells built, $failed failed, $left left for the next run, $(du -sm out | cut -f1) MB" \
            | tee -a "$GITHUB_STEP_SUMMARY"
          echo "FAILED=$failed" >> "$GITHUB_ENV"
      - id: art
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02   # v4
        with:
          name: aerial-${{ inputs.id }}
          path: out/
          retention-days: 3
          compression-level: 0          # (AVIF already)
          if-no-files-found: ignore
          overwrite: true
      - if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02   # v4
        with:
          name: aerial-${{ inputs.id }}-log
          path: cells.jsonl
          retention-days: 14
          if-no-files-found: ignore
          overwrite: true
      - if: ${{ env.FAILED != '0' }}
        run: exit 1

  upload:
    needs: build
    if: ${{ !cancelled() && !inputs.dry_run && needs.build.outputs.artifact != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262   # v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093   # v4
        with:
          name: aerial-${{ inputs.id }}
          path: in
      - name: Check, then upload the packs and the fragments
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          AWS_REQUEST_CHECKSUM_CALCULATION: when_required     # (R2 and aws-cli's default checksums: rail.yml)
          AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
          R2: https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com
          GEN: ${{ inputs.gen }}
        run: |
          set -euo pipefail
          python3 tools/aerial_ci.py check in --gen "$GEN" stage | tee -a "$GITHUB_STEP_SUMMARY"
          # (packs are at most a few MB: one PutObject each; R2 refused a small multipart completion, dem.yml)
          aws configure set default.s3.multipart_threshold 64MB
          aws configure set default.s3.max_concurrent_requests 16
          if [ -d stage/packs ]; then
            ok=0
            for try in 1 2 3 4; do
              if aws s3 sync stage/packs s3://bnge-tiles/aerial/v1 --endpoint-url "$R2" --only-show-errors \
                   --content-type application/octet-stream --cache-control "public, max-age=31536000, immutable"; then ok=1; break; fi
              echo "upload try $try failed: again in $((try * 20)) s"; sleep $((try * 20))
            done
            [ "$ok" -eq 1 ] || { echo "::error::packs not uploaded (fragments held back: run the workflow again)"; exit 1; }
          fi
          # the fragments last: a cell is done only once its packs are up
          if [ -d stage/frags ]; then
            aws s3 cp stage/frags s3://bnge-tiles/aerial/v1 --recursive --endpoint-url "$R2" --only-show-errors \
              --content-type application/json --cache-control "no-cache"
          fi
      - name: The artifact, now in the bucket, deleted
        if: ${{ success() }}
        env:
          GH_TOKEN: ${{ github.token }}
          ID: ${{ needs.build.outputs.artifact }}
        run: gh api -X DELETE "repos/${{ github.repository }}/actions/artifacts/$ID" || true
