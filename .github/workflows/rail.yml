# BeamNG.Earth's runtime data, rebuilt weekly and published to this repo's GitHub Pages: OpenStreetMap's railways
# (rail/, read by server/railtags.py), its lane-level road tags (lanes/, railtags.LaneTags), its highway sign sources (signs/, railtags.SignTags: exits, overhead destinations, mile references) and the FRA's level
# crossings (fra/, server/fra.py). The planet builds run as parallel jobs (each streams the planet twice); the
# site job puts them together (a Pages deployment replaces the whole site). The planet is streamed twice (curl into the builder): nothing is stored, so a
# standard runner's disk is enough. Data (c) OpenStreetMap contributors, ODbL 1.0.
name: data

on:
  schedule:
    - cron: "17 3 * * 5"            # Fridays 03:17 UTC (a new planet appears on Thursdays)
  workflow_dispatch:

permissions:
  contents: read   # (every job; site and deploy add theirs: the build jobs, which run pip's packages and code fetched
                   # from BeamNG.Earth, get a read-only token)

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  planet:
    runs-on: ubuntu-latest
    outputs:
      url: ${{ steps.planet.outputs.url }}
    steps:
      - name: "The newest planet (a dated file, so every pass reads the same week)"
        id: planet
        run: |
          MIRROR=https://ftp5.gwdg.de/pub/misc/openstreetmap/planet.openstreetmap.org/pbf
          NAME=$(curl -sfL "$MIRROR/" | grep -oE 'planet-[0-9]{6}\.osm\.pbf' | sort -u | tail -1)
          test -n "$NAME"
          echo "url=$MIRROR/$NAME" >> "$GITHUB_OUTPUT"
          echo "Planet: $NAME"

  rail:
    needs: planet
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065   # v5
        with:
          python-version: "3.12"
      - name: Tools
        run: pip install "osmium==4.3.2" numpy
      - name: "The builder (tools/build_rail_tags.py from BeamNG.Earth)"
        run: |
          # (tools/npyfirst.py + server/npyguard.py beside the builder: its "import npyfirst" holds numpy's AVX-512 kernels
          # back, so a runner on an AVX-512 CPU builds the same bytes as an AVX2 one; without them the import was skipped)
          for f in tools/npyfirst.py server/npyguard.py; do curl -sfL -o "$(basename "$f")" "https://raw.githubusercontent.com/TecnaGamer/BeamNG.Earth/dev/$f"; done
          curl -sfL -o build_rail_tags.py https://raw.githubusercontent.com/TecnaGamer/BeamNG.Earth/dev/tools/build_rail_tags.py
      - name: "FRA level crossings (tools/build_fra_shards.py)"
        continue-on-error: true
        run: |
          curl -sfL -o build_fra_shards.py https://raw.githubusercontent.com/TecnaGamer/BeamNG.Earth/dev/tools/build_fra_shards.py
          python build_fra_shards.py out/fra
      - name: Build
        run: |
          python build_rail_tags.py "${{ needs.planet.outputs.url }}" out/rail
          echo "${{ needs.planet.outputs.url }}" > out/rail/planet.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02   # v4
        with:
          name: rail
          path: out
          retention-days: 3

  lanes:
    needs: planet
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065   # v5
        with:
          python-version: "3.12"
      - name: Tools
        run: pip install "osmium==4.3.2" numpy
      - name: "The builder (tools/build_lane_tags.py from BeamNG.Earth, with build_rail_tags.py it uses)"
        run: |
          # (tools/npyfirst.py + server/npyguard.py beside the builder: its "import npyfirst" holds numpy's AVX-512 kernels
          # back, so a runner on an AVX-512 CPU builds the same bytes as an AVX2 one; without them the import was skipped)
          for f in tools/npyfirst.py server/npyguard.py; do curl -sfL -o "$(basename "$f")" "https://raw.githubusercontent.com/TecnaGamer/BeamNG.Earth/dev/$f"; done
          curl -sfL -o build_rail_tags.py https://raw.githubusercontent.com/TecnaGamer/BeamNG.Earth/dev/tools/build_rail_tags.py
          curl -sfL -o build_lane_tags.py https://raw.githubusercontent.com/TecnaGamer/BeamNG.Earth/dev/tools/build_lane_tags.py
      - name: Build
        run: |
          # (--xsec: the street tags of the road system's cross-sections, a "xsec" table beside "ways" in each shard:
          # parking, cycle / bus lanes, shoulders, sidewalks, width:carriageway; BeamNG.Earth's BNE_ROADSYS_XSEC; the
          # "ways" stay byte for byte as without it)
          python build_lane_tags.py "${{ needs.planet.outputs.url }}" out/lanes --xsec
          python3 -I - out/lanes/manifest.json <<'PY'
          import json, sys
          m = json.load(open(sys.argv[1]))
          assert m.get("xsec", 0) > 1000000, m    # (a cut-off stream makes a small table: not published)
          print("xsec ways:", m["xsec"])
          PY
          echo "${{ needs.planet.outputs.url }}" > out/lanes/planet.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02   # v4
        with:
          name: lanes
          path: out
          retention-days: 3

  signs:
    needs: planet
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065   # v5
        with:
          python-version: "3.12"
      - name: Tools
        run: pip install "osmium==4.3.2" numpy
      - name: "The builder (tools/build_sign_tags.py from BeamNG.Earth, with the sign modules it indexes with)"
        run: |
          B=https://raw.githubusercontent.com/TecnaGamer/BeamNG.Earth/dev
          for f in tools/npyfirst.py server/npyguard.py tools/build_sign_tags.py tools/build_rail_tags.py server/exitsigns.py server/throughsigns.py \
                   server/milemarkers.py server/routeshields.py server/signshards.py; do
            curl -sfL -o "$(basename "$f")" "$B/$f"
          done
          # (the sign modules' deterministic maths, dmath / dnp, call BeamNG.Earth's native module; this one CI build
          # makes the one file every player reads, so math and numpy stand in for them here: without these the job
          # failed from 2026-11-13 on, BeamNG.Earth #1169)
          printf 'import math\n\n\ndef __getattr__(n):\n    return getattr(math, n)\n' > dmath.py
          printf 'import numpy as np\n\n\ndef __getattr__(n):\n    return getattr(np, n) if hasattr(np, n) else getattr(np.linalg, n)\n' > dnp.py
      - name: Build
        run: |
          python build_sign_tags.py "${{ needs.planet.outputs.url }}" out/signs
          echo "${{ needs.planet.outputs.url }}" > out/signs/planet.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02   # v4
        with:
          name: signs
          path: out
          retention-days: 14   # (> a week: the deploy reuses the last good one when this job fails)

  routes:
    # US road-route identities and way memberships only (no geometry or sign positions), for the US route shields:
    # tools/build_route_relation_index.py (data PR #4, wyo-backroads, ported). Optional like the signs.
    needs: planet
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262   # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065   # v5
        with:
          python-version: "3.12"
      - name: Tools
        run: pip install "osmium==4.3.2"
      - name: Builder tests
        run: python -m unittest discover -s tests -v
      - name: Build
        run: python tools/build_route_relation_index.py "${{ needs.planet.outputs.url }}" out/routes
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02   # v4
        with:
          name: routes
          path: out
          retention-days: 14   # (> a week: the deploy reuses the last good one when this job fails)

  osmtags:
    # OpenStreetMap's road tags (lanes, width, speed limit, sidewalk, surface ...) of OSM US's Layercake highways file,
    # one blob per zoom-12 tile in a PMTiles archive cut into parts of <= 400 MB (BeamNG.Earth
    # tools/build_osm_tag_shards.py; a copy in this repo, as the tiles workflow's builder). Built here WITHOUT secrets
    # (pip's DuckDB and numpy run only in this job), sealed (tools/pack_check.py seal) and handed over as the artifact
    # osmtags-build; osmtags_publish, the job holding the R2 secrets, checks it again and uploads it. The parts (~2.4
    # GB in all, over Pages' 1 GB; each under the 512 MB Cloudflare's free plan caches) go to the tile host (R2 behind
    # tiles.tgforever.net) under a key of their own build, never overwritten; only the manifest is published on
    # Pages, pointing at them. Optional: without it the server reads the Layercake file as before.
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262   # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065   # v5
        with:
          python-version: "3.12"
      - name: Tools
        run: pip install "duckdb==1.5.6" numpy
      - name: Room on the runner
        # (the first run was stopped at row group 1500 of ~2500, "the runner has received a shutdown signal": out of
        # disk or memory with ~11 GB of decoded rows; the preinstalled SDKs this job does not use take ~30 GB)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          df -h / /mnt || true; free -h
      - name: Build
        run: |
          D=/mnt/otg; [ "$(df --output=avail -B1G /mnt 2>/dev/null | tail -1)" -gt 20 ] 2>/dev/null || D=$HOME/otg
          sudo mkdir -p "$D" && sudo chown "$USER" "$D"
          echo "OTG=$D" >> "$GITHUB_ENV"
          ( while sleep 120; do df -h "$D" | tail -1; free -m | sed -n 2p; done ) &
          python tools/build_osm_tag_shards.py https://data.openstreetmap.us/layercake/highways.parquet \
            "$D/out/osmtags" --workers 3 --tmp "$D/tmp"
          rm -rf "$D/tmp"
          python3 -I tools/pack_check.py seal "$D/out" osmtags
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02   # v4
        with:
          name: osmtags-build
          path: ${{ env.OTG }}/out
          retention-days: 3
          if-no-files-found: error
          compression-level: 0     # (PMTiles parts of deflated tiles)

  osmtags_publish:
    # (R2 secrets: this repo's tools/pack_check.py and aws-cli only, tools/pack_publish.sh) osmtags' build checked
    # again (names, sizes, PMTiles, the seal's SHA-256), its parts to osmtags/<key>/ (<key>: the manifest's "built",
    # never overwritten), then the manifest pointing at them as the artifact osmtags for the site job
    needs: osmtags
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262   # v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093   # v4
        with:
          name: osmtags-build
          path: art
      - name: The parts to the tile host, the manifest pointing at them
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2: https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com
          # (aws-cli 2.23+ sends its default CRC checksums with every multipart part; R2's CompleteMultipartUpload then
          # refused the parts, "InvalidPart", 2026-11-12: Cloudflare's advice is checksums only when required)
          AWS_REQUEST_CHECKSUM_CALCULATION: when_required
          AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
          CHUNK: 64MB     # (aws-cli multipart parts of 64 MB, as this job set before)
        run: bash tools/pack_publish.sh osmtags
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02   # v4
        with:
          name: osmtags
          path: pub
          retention-days: 14   # (> a week: the deploy reuses the last good one when this job fails)
          if-no-files-found: error

  osmyears:
    # OpenStreetMap's building construction years (start_date) of OSM US's Layercake buildings file, one blob per
    # zoom-12 tile in PMTiles archive parts (BeamNG.Earth tools/build_osm_building_years.py, read by
    # server/osmyears.py: pre-war towers drawn in masonry, not glass). A copy in this repo, as osmtags' builder, run
    # here WITHOUT secrets; osmyears_publish (R2 secrets) checks the artifact osmyears-build again and uploads it.
    # Each build's parts go to the tile host in a folder of their own (osmyears/<key>/, never overwritten: a running
    # server keeps reading the build it started on), each checked against the manifest's SHA-256 first; only the
    # manifest is published on Pages, pointing at them, after the parts. Optional: without it the towers are drawn as
    # before.
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262   # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065   # v5
        with:
          python-version: "3.12"
      - name: Tools
        run: pip install "duckdb==1.5.6" numpy
      - name: Build
        run: |
          python tools/build_osm_building_years.py https://data.openstreetmap.us/layercake/buildings.parquet \
            out/osmyears --workers 3
          python3 -I tools/pack_check.py seal out osmyears
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02   # v4
        with:
          name: osmyears-build
          path: out
          retention-days: 3
          if-no-files-found: error
          compression-level: 0     # (PMTiles parts of deflated tiles)

  osmyears_publish:
    # (R2 secrets: this repo's tools/pack_check.py and aws-cli only, tools/pack_publish.sh) the build checked again,
    # its parts to osmyears/<key>/ (never overwritten), then the manifest pointing at them (artifact osmyears)
    needs: osmyears
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262   # v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093   # v4
        with:
          name: osmyears-build
          path: art
      - name: The parts to the tile host, the manifest pointing at them
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2: https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com
          AWS_REQUEST_CHECKSUM_CALCULATION: when_required     # (see the osmtags_publish job)
          AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
        run: bash tools/pack_publish.sh osmyears
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02   # v4
        with:
          name: osmyears
          path: pub
          retention-days: 14   # (> a week: the deploy reuses the last good one when this job fails)
          if-no-files-found: error

  osmcolours:
    # OpenStreetMap's mapped colours of buildings and building parts (building:colour, roof:colour) as RGB, from the
    # newest planet (streamed three times by curl: nothing stored), one blob per zoom-12 tile in PMTiles archive parts
    # (BeamNG.Earth tools/build_osm_building_colours.py, read by server/osmcolours.py: the colours Overture drops,
    # filled only where its own are empty). Pinned copies in this repo (with build_osm_building_years.py and
    # build_osm_tag_shards.py, which write its parts), run here WITHOUT secrets; osmcolours_publish (R2 secrets) checks
    # the artifact osmcolours-build again and uploads it. The parts and the manifest as osmyears': each build's parts
    # in a folder of their own (osmcolours/<key>/, never overwritten), each checked against the manifest's size and
    # SHA-256 first, the manifest on Pages pointing at them, after the parts. Optional: without it the buildings keep
    # Overture's colours.
    needs: planet
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262   # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065   # v5
        with:
          python-version: "3.12"
      - name: Tools
        run: pip install "osmium==4.3.2" numpy
      - name: Build
        run: |
          python tools/build_osm_building_colours.py "${{ needs.planet.outputs.url }}" out/osmcolours
          python3 -I tools/pack_check.py seal out osmcolours
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02   # v4
        with:
          name: osmcolours-build
          path: out
          retention-days: 3
          if-no-files-found: error
          compression-level: 0     # (PMTiles parts of deflated tiles)

  osmcolours_publish:
    # (R2 secrets: this repo's tools/pack_check.py and aws-cli only, tools/pack_publish.sh) the build checked again,
    # its parts to osmcolours/<key>/ (never overwritten), then the manifest pointing at them (artifact osmcolours)
    needs: osmcolours
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262   # v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093   # v4
        with:
          name: osmcolours-build
          path: art
      - name: The parts to the tile host, the manifest pointing at them
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2: https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com
          AWS_REQUEST_CHECKSUM_CALCULATION: when_required     # (see the osmtags_publish job)
          AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
        run: bash tools/pack_publish.sh osmcolours
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02   # v4
        with:
          name: osmcolours
          path: pub
          retention-days: 14   # (> a week: the deploy reuses the last good one when this job fails)
          if-no-files-found: error

  osmareas:
    # OpenStreetMap's mapped road areas (area:highway=* polygons: the carriageway's real width beside the centre line,
    # traffic islands, junction areas; ~485k worldwide, 2026-11-23), from the newest planet (streamed three times by
    # curl: nothing stored), one blob per zoom-14 tile (the server's map cells) in PMTiles archive parts
    # (BeamNG.Earth tools/build_osm_road_areas.py, read by server/osmareas.py: the road system's audit of its surface
    # and, behind BNE_ROADSYS_AREAS=on, the carriageway edges' targets). Pinned copies in this repo (with
    # build_osm_building_years.py and build_osm_tag_shards.py, which write its parts). Built here WITHOUT secrets
    # (pip's osmium and numpy run only in this job), sealed (tools/pack_check.py seal) and handed over as the artifact
    # osmareas-build; osmareas_publish, the job holding the R2 secrets, checks it again and uploads it. The parts and
    # the manifest as osmyears': each build's parts in a folder of their own (osmareas/<key>/, never overwritten),
    # each checked against the manifest's size and SHA-256 first, the manifest on Pages pointing at them, after the
    # parts. Optional: without it the roads are built as before. (~10 min from a local planet file, 2026-11-23; ~54 MB
    # out in one part.)
    needs: planet
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262   # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065   # v5
        with:
          python-version: "3.12"
      - name: Tools
        run: pip install "osmium==4.3.2" numpy
      - name: Build
        run: |
          python tools/build_osm_road_areas.py "${{ needs.planet.outputs.url }}" out/osmareas
          python3 -I tools/pack_check.py seal out osmareas
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02   # v4
        with:
          name: osmareas-build
          path: out
          retention-days: 3
          if-no-files-found: error
          compression-level: 0     # (PMTiles parts of deflated tiles)

  osmareas_publish:
    # (R2 secrets: this repo's tools/pack_check.py and aws-cli only, tools/pack_publish.sh) osmareas' build checked
    # again (names, sizes, PMTiles, SHA-256 against the manifest and the seal; zoom 14, format 1, over 100,000 polygons:
    # a cut-off stream makes a small build, not published), its parts to osmareas/<key>/ (never overwritten), then
    # the manifest pointing at them as the artifact osmareas for the site job
    needs: osmareas
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262   # v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093   # v4
        with:
          name: osmareas-build
          path: art
      - name: The parts to the tile host, the manifest pointing at them
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2: https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com
          AWS_REQUEST_CHECKSUM_CALCULATION: when_required     # (see the osmtags_publish job)
          AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
        run: bash tools/pack_publish.sh osmareas
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02   # v4
        with:
          name: osmareas
          path: pub
          retention-days: 14   # (> a week: the deploy reuses the last good one when this job fails)
          if-no-files-found: error

  stations:
    # OpenStreetMap's fuel and charging stations with their capacity, and the charge points (stations/, read by
    # BeamNG.Earth's server/railtags.py StationTags: the station finder's map everywhere, EV chargers' real counts and
    # spots). Optional like the signs: a failed job leaves it out and the rest still publishes.
    needs: planet
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065   # v5
        with:
          python-version: "3.12"
      - name: Tools
        run: pip install "osmium==4.3.2" numpy
      - name: "The builder (tools/build_station_tags.py from BeamNG.Earth, with build_rail_tags.py it uses)"
        run: |
          B=https://raw.githubusercontent.com/TecnaGamer/BeamNG.Earth/dev
          # (tools/npyfirst.py + server/npyguard.py beside the builder: its "import npyfirst" holds numpy's AVX-512 kernels
          # back, so a runner on an AVX-512 CPU builds the same bytes as an AVX2 one; without them the import was skipped)
          for f in tools/npyfirst.py server/npyguard.py; do curl -sfL -o "$(basename "$f")" "https://raw.githubusercontent.com/TecnaGamer/BeamNG.Earth/dev/$f"; done
          curl -sfL -o build_rail_tags.py "$B/tools/build_rail_tags.py"
          curl -sfL -o build_station_tags.py "$B/tools/build_station_tags.py"
      - name: Build
        run: |
          python build_station_tags.py "${{ needs.planet.outputs.url }}" out/stations
          echo "${{ needs.planet.outputs.url }}" > out/stations/planet.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02   # v4
        with:
          name: stations
          path: out
          retention-days: 14   # (> a week: the deploy reuses the last good one when this job fails)

  drive:
    # OpenStreetMap's mapped driving features that neither Overture nor the Layercake highways file carry (drive/, read
    # by BeamNG.Earth's server/drivetags.py, only while one of its mapped-feature switches is on): traffic calming,
    # turning circles / loops, mini roundabouts, passing places, fords, railway signals / points / buffer stops, and
    # the tracktype / ford / traffic_calming of highway ways. Optional like the signs: a failed job leaves it out.
    needs: planet
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065   # v5
        with:
          python-version: "3.12"
      - name: Tools
        run: pip install "osmium==4.3.2" numpy
      - name: "The builder (tools/build_drive_tags.py from BeamNG.Earth, with build_rail_tags.py it uses)"
        run: |
          B=https://raw.githubusercontent.com/TecnaGamer/BeamNG.Earth/dev
          for f in tools/npyfirst.py server/npyguard.py tools/build_rail_tags.py tools/build_drive_tags.py; do
            curl -sfL -o "$(basename "$f")" "$B/$f"
          done
      - name: Build
        run: |
          python build_drive_tags.py "${{ needs.planet.outputs.url }}" out/drive
          echo "${{ needs.planet.outputs.url }}" > out/drive/planet.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02   # v4
        with:
          name: drive
          path: out
          retention-days: 14   # (> a week: the deploy reuses the last good one when this job fails)

  tallbld:
    # The tall-building index for the horizon ring (BeamNG.Earth tools/build_tall_index.py, read by server/bldhz.py):
    # every Overture building at least 60 m tall (its height, its storeys or one of its parts) with all its parts, one
    # blob a zoom-12 tile, in PMTiles archive parts. From the Overture release pinned here (tools/overture_stac_*.json.gz:
    # its file list): the files' footers first (tail reads, cached by release), then only the row groups whose
    # statistics may hold a tall building (~7.6k row groups, ~23 GB of ranges from Overture's S3, into sparse files
    # under /mnt). A pinned copy in this repo, as osmyears' builder, run here WITHOUT secrets; tallbld_publish (R2
    # secrets) checks the artifact tallbld-build again and uploads it. The parts and the manifest as osmyears': each
    # build's parts in a folder of their own
    # (tallbld/<key>/, never overwritten), each checked against the manifest's size and SHA-256 first, the manifest on
    # Pages pointing at them, after the parts. Optional: without it there are no buildings past the skyline.
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262   # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065   # v5
        with:
          python-version: "3.12"
      - name: Tools
        run: pip install "duckdb==1.5.6" numpy
      - name: The release
        id: rel
        run: |
          S=$(ls tools/overture_stac_*.json.gz | sort | tail -1)
          echo "stac=$S" >> "$GITHUB_OUTPUT"
          echo "release=$(basename "$S" .json.gz | sed 's/^overture_stac_//')" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830   # v4
        with:
          path: footers
          key: tallbld-footers-${{ steps.rel.outputs.release }}
      - name: Build
        run: |
          sudo mkdir -p /mnt/tallwork && sudo chown "$USER" /mnt/tallwork
          df -h / /mnt
          python tools/build_tall_index.py --stac "${{ steps.rel.outputs.stac }}" --footers footers --fetch-footers
          python tools/build_tall_index.py --stac "${{ steps.rel.outputs.stac }}" --footers footers \
            --work /mnt/tallwork --world --pages out/tallbld
          sudo rm -rf /mnt/tallwork   # (/mnt is root's: the folder itself goes with sudo)
          python3 -I tools/pack_check.py seal out tallbld
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02   # v4
        with:
          name: tallbld-build
          path: out
          retention-days: 3
          if-no-files-found: error
          compression-level: 0     # (PMTiles parts of deflated tiles)

  tallbld_publish:
    # (R2 secrets: this repo's tools/pack_check.py and aws-cli only, tools/pack_publish.sh) the build checked again,
    # its parts to tallbld/<key>/ (never overwritten), then the manifest pointing at them (artifact tallbld)
    needs: tallbld
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262   # v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093   # v4
        with:
          name: tallbld-build
          path: art
      - name: The parts to the tile host, the manifest pointing at them
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2: https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com
          AWS_REQUEST_CHECKSUM_CALCULATION: when_required     # (see the osmtags_publish job)
          AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
        run: bash tools/pack_publish.sh tallbld
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02   # v4
        with:
          name: tallbld
          path: pub
          retention-days: 14   # (> a week: the deploy reuses the last good one when this job fails)
          if-no-files-found: error

  site:
    needs: [rail, lanes, signs, osmtags_publish, osmyears_publish, osmcolours_publish, osmareas_publish, stations,
            tallbld_publish, routes, drive]
    # (the sign shards, the OSM road tags and the stations are optional: a failed signs / osmtags / stations job leaves
    # them out, the rail and lane data still publish; osmyears, osmcolours and osmareas likewise; a failed build job
    # skips its publish job, which waits for it)
    if: ${{ !cancelled() && needs.rail.result == 'success' && needs.lanes.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read   # (an optional job that failed keeps its last good artifact)
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262   # v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093   # v4
        with:
          path: parts
          # (every artifact of this run but the builds handed to the publish jobs, <name>-build: their parts are on
          # the tile host, only the publish jobs' manifests go on Pages)
          pattern: "!*-build"
      - name: Site
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p site
          # an optional job that failed this time: its last good artifact from an earlier run instead (a deploy
          # replaces the whole site, so a failed signs job took the sign shards off Pages from 2026-11-13 on)
          for n in signs osmtags osmyears osmcolours osmareas tallbld stations routes drive; do
            [ -d "parts/$n" ] && continue
            id=$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?name=$n&per_page=20" -q '[.artifacts[] | select(.expired | not)][0].workflow_run.id // empty' || true)
            if [ -n "$id" ] && gh run download "$id" -R "$GITHUB_REPOSITORY" -n "$n" -D "parts/$n"; then
              echo "$n: this run's job failed; the artifact of run $id instead"; fi
          done
          cp -r parts/rail/* site/
          cp -r parts/lanes/* site/
          if [ -d parts/signs ]; then cp -r parts/signs/* site/; fi
          if [ -d parts/osmtags ]; then cp -r parts/osmtags/* site/; fi
          if [ -d parts/osmyears ]; then cp -r parts/osmyears/* site/; fi
          if [ -d parts/osmcolours ]; then cp -r parts/osmcolours/* site/; fi
          if [ -d parts/osmareas ]; then cp -r parts/osmareas/* site/; fi
          if [ -d parts/tallbld ]; then cp -r parts/tallbld/* site/; fi
          if [ -d parts/stations ]; then cp -r parts/stations/* site/; fi
          if [ -d parts/routes ]; then cp -r parts/routes/* site/; fi
          if [ -d parts/drive ]; then cp -r parts/drive/* site/; fi
          # PR #505's regional scenery data (BeamNG.Earth tools/build_regional_data.py): static, from this repo's
          # release "regional-data" (asset regional.tar), unpacked as site/regional (optional: without it the rest publishes)
          if gh release download regional-data -R "$GITHUB_REPOSITORY" -p regional.tar -D parts 2>/dev/null; then
            mkdir -p site/regional && tar xf parts/regional.tar -C site/regional; fi
          # PR #872's measured German roofs (Henner4746, tools/build_lod2_roofs.py from the states' open LoD2 models):
          # static, from this repo's release "lod2-data" (asset lod2.tar, holding lod2/), unpacked as site/lod2 (optional)
          if gh release download lod2-data -R "$GITHUB_REPOSITORY" -p lod2.tar -D parts 2>/dev/null; then
            tar xf parts/lod2.tar -C site; rm -f parts/lod2.tar; fi
          # New York's measured building massing (BeamNG.Earth tools/build_nyc_massing.py from NYC Open Data's 2014 3-D
          # Building Model): static, from this repo's release "nycmassing-data" (asset nycmassing.tar, holding nycmassing/)
          if gh release download nycmassing-data -R "$GITHUB_REPOSITORY" -p nycmassing.tar -D parts 2>/dev/null; then
            tar xf parts/nycmassing.tar -C site; rm -f parts/nycmassing.tar; fi
          # Measured roofs beyond Germany (BeamNG.Earth tools/build_lod2_roofs.py: Switzerland + Liechtenstein, Estonia,
          # Vienna): static, from this repo's release "lod2-more-data" (asset lod2more.tar: lod2-ch/, lod2-ee/, lod2-wien/)
          if gh release download lod2-more-data -R "$GITHUB_REPOSITORY" -p lod2more.tar -D parts 2>/dev/null; then
            tar xf parts/lod2more.tar -C site; rm -f parts/lod2more.tar; fi
          # BeamNG.Earth PR #1036's surveyed German roads (Henner4746, tools/build_de_roads.py from the states' ATKIS
          # Basis-DLM via basemap.de): static, holding deroads/ (684 shards, 216 MB, each state's licence in
          # deroads/ATTRIBUTION.md). From this repo's release "deroads-data" (asset deroads.tar) when there is one, else
          # the release the PR names on Henner4746's fork, kept only when its SHA-256 is the one pinned here (optional:
          # without it the rest publishes)
          DEROADS_SHA=39bf31c73fc1106af0fb231bf9b29a21e7296e22333209b8777446e075f37325
          if gh release download deroads-data -R "$GITHUB_REPOSITORY" -p deroads.tar -D parts 2>/dev/null; then
            tar xf parts/deroads.tar -C site; rm -f parts/deroads.tar
          elif gh release download de-roads-data-2026-11-09 -R Henner4746/BeamNG.Earth -p de-roads-16-states.tar               -D parts 2>/dev/null && echo "$DEROADS_SHA  parts/de-roads-16-states.tar" | sha256sum -c -; then
            tar xf parts/de-roads-16-states.tar -C site; rm -f parts/de-roads-16-states.tar
          else
            rm -f parts/de-roads-16-states.tar; echo "deroads: not published this run"; fi
          # (a link out of the site, from a release's tar: dropped, else the Pages artifact (tar --dereference) and the
          # R2 mirror below (aws s3 cp follows links) would publish the runner's file it names)
          R=$(readlink -f site)
          find site -type l | while read -r l; do
            case "$(readlink -f "$l")" in "$R/"*) ;; *) echo "::warning::$l: a link out of the site, not published"; rm -f "$l";; esac
          done
          du -sh site; du -sh site/* | sort -h | tail -8
          cp README.md site/
          printf '<!doctype html><meta charset="utf-8"><title>BeamNG.Earth data</title><p>Data for <a href="https://github.com/TecnaGamer/BeamNG.Earth">BeamNG.Earth</a>. Railways: <a href="rail/manifest.json">rail/manifest.json</a>, lane-level road tags: <a href="lanes/manifest.json">lanes/manifest.json</a>, highway sign sources: <a href="signs/manifest.json">signs/manifest.json</a>, US road-route membership: <a href="routes/manifest.json">routes/manifest.json</a>, fuel and charging stations: <a href="stations/manifest.json">stations/manifest.json</a>, level crossings (US): <a href="fra/manifest.json">fra/manifest.json</a>, measured German roofs: <a href="lod2/manifest.json">lod2/manifest.json</a> (sources and licences: <a href="lod2/ATTRIBUTION.md">lod2/ATTRIBUTION.md</a>), surveyed German roads: <a href="deroads/ATTRIBUTION.md">deroads/ATTRIBUTION.md</a>, measured roofs of Switzerland, Estonia and Vienna: <a href="lod2-ch/ATTRIBUTION.md">lod2-ch</a>, <a href="lod2-ee/ATTRIBUTION.md">lod2-ee</a>, <a href="lod2-wien/ATTRIBUTION.md">lod2-wien</a>, New York building massing: <a href="nycmassing/v1/manifest.json">nycmassing/v1/manifest.json</a> (<a href="nycmassing/ATTRIBUTION.md">nycmassing/ATTRIBUTION.md</a>). Data &copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap contributors</a>, ODbL 1.0.\n' > site/index.html
          ls site
      - name: The datasets' files to the tile host, each manifest naming that copy ("data")
        # (players read ~1.15 TB a month of these from Pages, whose soft limit is 100 GB: BeamNG.Earth's server reads a
        # dataset's files from the manifest's "data", R2 behind tiles.tgforever.net, cached by Cloudflare; Pages keeps
        # every file too, for clients from before. tools/mirror_data.py is this repo's own, run with the R2 token: no
        # code from elsewhere here. A dataset that fails stays on Pages only; the site still publishes.)
        continue-on-error: true
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2: https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com
          AWS_REQUEST_CHECKSUM_CALCULATION: when_required     # (see the osmtags_publish job)
          AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
        run: |
          aws configure set default.s3.max_concurrent_requests 32
          python3 -I tools/mirror_data.py site
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa   # v3
        with:
          path: site

  deploy:
    needs: site
    # (an optional job's failure upstream (osmtags, signs) must not hold the site back: by default a job is skipped
    # when anything before it failed, and the 2026-11-11 run built the site and never deployed it)
    if: ${{ !cancelled() && needs.site.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e   # v4
