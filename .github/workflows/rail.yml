# BeamNG.Earth's runtime data, rebuilt weekly and published to this repo's GitHub Pages: OpenStreetMap's railways
# (rail/, read by server/railtags.py), its lane-level road tags (lanes/, railtags.LaneTags), its highway sign sources (signs/, railtags.SignTags: exits, overhead destinations, mile references) and the FRA's level
# crossings (fra/, server/fra.py). The planet builds run as parallel jobs (each streams the planet twice); the
# site job puts them together (a Pages deployment replaces the whole site). The planet is streamed twice (curl into the builder): nothing is stored, so a
# standard runner's disk is enough. Data (c) OpenStreetMap contributors, ODbL 1.0.
name: data

on:
  schedule:
    - cron: "17 3 * * 5"            # Fridays 03:17 UTC (a new planet appears on Thursdays)
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  planet:
    runs-on: ubuntu-latest
    outputs:
      url: ${{ steps.planet.outputs.url }}
    steps:
      - name: "The newest planet (a dated file, so every pass reads the same week)"
        id: planet
        run: |
          MIRROR=https://ftp5.gwdg.de/pub/misc/openstreetmap/planet.openstreetmap.org/pbf
          NAME=$(curl -sfL "$MIRROR/" | grep -oE 'planet-[0-9]{6}\.osm\.pbf' | sort -u | tail -1)
          test -n "$NAME"
          echo "url=$MIRROR/$NAME" >> "$GITHUB_OUTPUT"
          echo "Planet: $NAME"

  rail:
    needs: planet
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Tools
        run: pip install "osmium==4.3.2" numpy
      - name: "The builder (tools/build_rail_tags.py from BeamNG.Earth)"
        run: curl -sfL -o build_rail_tags.py https://raw.githubusercontent.com/TecnaGamer/BeamNG.Earth/dev/tools/build_rail_tags.py
      - name: "FRA level crossings (tools/build_fra_shards.py)"
        continue-on-error: true
        run: |
          curl -sfL -o build_fra_shards.py https://raw.githubusercontent.com/TecnaGamer/BeamNG.Earth/dev/tools/build_fra_shards.py
          python build_fra_shards.py out/fra
      - name: Build
        run: |
          python build_rail_tags.py "${{ needs.planet.outputs.url }}" out/rail
          echo "${{ needs.planet.outputs.url }}" > out/rail/planet.txt
      - uses: actions/upload-artifact@v4
        with:
          name: rail
          path: out
          retention-days: 3

  lanes:
    needs: planet
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Tools
        run: pip install "osmium==4.3.2" numpy
      - name: "The builder (tools/build_lane_tags.py from BeamNG.Earth, with build_rail_tags.py it uses)"
        run: |
          curl -sfL -o build_rail_tags.py https://raw.githubusercontent.com/TecnaGamer/BeamNG.Earth/dev/tools/build_rail_tags.py
          curl -sfL -o build_lane_tags.py https://raw.githubusercontent.com/TecnaGamer/BeamNG.Earth/dev/tools/build_lane_tags.py
      - name: Build
        run: |
          python build_lane_tags.py "${{ needs.planet.outputs.url }}" out/lanes
          echo "${{ needs.planet.outputs.url }}" > out/lanes/planet.txt
      - uses: actions/upload-artifact@v4
        with:
          name: lanes
          path: out
          retention-days: 3

  signs:
    needs: planet
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Tools
        run: pip install "osmium==4.3.2" numpy
      - name: "The builder (tools/build_sign_tags.py from BeamNG.Earth, with the sign modules it indexes with)"
        run: |
          B=https://raw.githubusercontent.com/TecnaGamer/BeamNG.Earth/dev
          for f in tools/build_sign_tags.py tools/build_rail_tags.py server/exitsigns.py server/throughsigns.py \
                   server/milemarkers.py server/routeshields.py server/signshards.py; do
            curl -sfL -o "$(basename "$f")" "$B/$f"
          done
      - name: Build
        run: |
          python build_sign_tags.py "${{ needs.planet.outputs.url }}" out/signs
          echo "${{ needs.planet.outputs.url }}" > out/signs/planet.txt
      - uses: actions/upload-artifact@v4
        with:
          name: signs
          path: out
          retention-days: 3

  osmtags:
    # OpenStreetMap's road tags (lanes, width, speed limit, sidewalk, surface ...) of OSM US's Layercake highways file,
    # one blob per zoom-12 tile in one PMTiles archive (BeamNG.Earth tools/build_osm_tag_shards.py; a copy in this
    # repo, as the tiles workflow's builder: this job holds the R2 secrets, so it runs no code fetched from elsewhere).
    # The archive (~2.5 GB, over Pages' 1 GB) goes to the tile host (R2 behind tiles.tgforever.net) under a key of its
    # own build, never overwritten; only the manifest is published on Pages, pointing at it. Optional: without it the
    # server reads the Layercake file as before.
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Tools
        run: pip install "duckdb==1.5.6" numpy
      - name: Build
        run: |
          sudo mkdir -p /mnt/otg && sudo chown "$USER" /mnt/otg
          python tools/build_osm_tag_shards.py https://data.openstreetmap.us/layercake/highways.parquet \
            /mnt/otg/out/osmtags --workers 4 --tmp /mnt/otg/tmp
          rm -rf /mnt/otg/tmp
      - name: The archive to the tile host, the manifest pointing at it
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2: https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com
        run: |
          D=/mnt/otg/out/osmtags
          KEY=$(python -c "import json, re; print(re.sub(r'[^0-9A-Za-z]+', '_', json.load(open('$D/manifest.json'))['built']))")
          aws s3 cp "$D/osmtags.pmtiles" "s3://bnge-tiles/osmtags/$KEY/osmtags.pmtiles" --endpoint-url "$R2" \
            --only-show-errors --content-type application/octet-stream --cache-control "public, max-age=31536000, immutable"
          python - "$D/manifest.json" "https://tiles.tgforever.net/osmtags/$KEY/osmtags.pmtiles" <<'PY'
          import json, sys
          m = json.load(open(sys.argv[1]))
          m["archive"] = sys.argv[2]
          json.dump(m, open(sys.argv[1], "w"), separators=(",", ":"))
          PY
          rm "$D/osmtags.pmtiles"
          mkdir -p out && cp -r "$D" out/
          cat out/osmtags/manifest.json | head -c 400; echo
      - uses: actions/upload-artifact@v4
        with:
          name: osmtags
          path: out
          retention-days: 3

  site:
    needs: [rail, lanes, signs, osmtags]
    # (the sign shards and the OSM road tags are optional: a failed signs / osmtags job leaves them out, the rail and
    # lane data still publish)
    if: ${{ !cancelled() && needs.rail.result == 'success' && needs.lanes.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: parts
      - name: Site
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p site
          cp -r parts/rail/* site/
          cp -r parts/lanes/* site/
          if [ -d parts/signs ]; then cp -r parts/signs/* site/; fi
          if [ -d parts/osmtags ]; then cp -r parts/osmtags/* site/; fi
          # PR #505's regional scenery data (BeamNG.Earth tools/build_regional_data.py): static, from this repo's
          # release "regional-data" (asset regional.tar), unpacked as site/regional (optional: without it the rest publishes)
          if gh release download regional-data -R "$GITHUB_REPOSITORY" -p regional.tar -D parts 2>/dev/null; then
            mkdir -p site/regional && tar xf parts/regional.tar -C site/regional; fi
          # PR #872's measured German roofs (Henner4746, tools/build_lod2_roofs.py from the states' open LoD2 models):
          # static, from this repo's release "lod2-data" (asset lod2.tar, holding lod2/), unpacked as site/lod2 (optional)
          if gh release download lod2-data -R "$GITHUB_REPOSITORY" -p lod2.tar -D parts 2>/dev/null; then
            tar xf parts/lod2.tar -C site; rm -f parts/lod2.tar; fi
          # New York's measured building massing (BeamNG.Earth tools/build_nyc_massing.py from NYC Open Data's 2014 3-D
          # Building Model): static, from this repo's release "nycmassing-data" (asset nycmassing.tar, holding nycmassing/)
          if gh release download nycmassing-data -R "$GITHUB_REPOSITORY" -p nycmassing.tar -D parts 2>/dev/null; then
            tar xf parts/nycmassing.tar -C site; rm -f parts/nycmassing.tar; fi
          # Measured roofs beyond Germany (BeamNG.Earth tools/build_lod2_roofs.py: Switzerland + Liechtenstein, Estonia,
          # Vienna): static, from this repo's release "lod2-more-data" (asset lod2more.tar: lod2-ch/, lod2-ee/, lod2-wien/)
          if gh release download lod2-more-data -R "$GITHUB_REPOSITORY" -p lod2more.tar -D parts 2>/dev/null; then
            tar xf parts/lod2more.tar -C site; rm -f parts/lod2more.tar; fi
          du -sh site; du -sh site/* | sort -h | tail -8
          cp README.md site/
          printf '<!doctype html><meta charset="utf-8"><title>BeamNG.Earth data</title><p>Data for <a href="https://github.com/TecnaGamer/BeamNG.Earth">BeamNG.Earth</a>. Railways: <a href="rail/manifest.json">rail/manifest.json</a>, lane-level road tags: <a href="lanes/manifest.json">lanes/manifest.json</a>, highway sign sources: <a href="signs/manifest.json">signs/manifest.json</a>, level crossings (US): <a href="fra/manifest.json">fra/manifest.json</a>, measured German roofs: <a href="lod2/manifest.json">lod2/manifest.json</a> (sources and licences: <a href="lod2/ATTRIBUTION.md">lod2/ATTRIBUTION.md</a>), measured roofs of Switzerland, Estonia and Vienna: <a href="lod2-ch/ATTRIBUTION.md">lod2-ch</a>, <a href="lod2-ee/ATTRIBUTION.md">lod2-ee</a>, <a href="lod2-wien/ATTRIBUTION.md">lod2-wien</a>, New York building massing: <a href="nycmassing/v1/manifest.json">nycmassing/v1/manifest.json</a> (<a href="nycmassing/ATTRIBUTION.md">nycmassing/ATTRIBUTION.md</a>). Data &copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap contributors</a>, ODbL 1.0.\n' > site/index.html
          ls site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: site
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
