# The weekly pruning of the tile host's bucket (R2 bnge-tiles behind tiles.tgforever.net; the user's go, 2026-11-27).
# tools/r2prune.py (this repo's own, standard-library Python plus aws-cli) decides; see its docstring for the rules:
#   snapshots (osmtags, osmyears, osmareas, osmcolours, tallbld, data/<dataset>): the newest 3 complete + the one the
#     Pages manifest points to + anything newer than the newest complete (maybe still uploading);
#   versioned releases (bnwt<N>, cip<N>, cliff, watershare, leaftype, nbiskew, dem): what cdn.json names, everything
#     at or above the latest released app's Overture RELEASE, the newest 2 complete, and nothing older unless a newer
#     complete version's marker is 14+ days old;
#   everything else (s2wc, s2c, aerial, dec, scratch, unknown) is kept and listed in the summary.
#
#   guard  [no secrets, read-only token] refuses while another workflow of this repo is running (the data, bnwt, cip,
#          aerial, tiles... jobs write the prefixes); reads the latest released app's Overture RELEASE as text (a regexp,
#          never executed) so the versions its players use are kept
#   prune  [R2 secrets; this repo's tools/r2prune.py and aws-cli only, no code from elsewhere] lists, plans, writes the
#          plan to the job summary; deletes only when dry_run is false (the weekly cron: yes) on main, and refuses to
#          delete more than max_delete_gb (500) in one run
# By hand: Actions -> r2prune -> Run workflow; dry_run defaults to true. Deleted objects cannot be brought back (no
# bucket versioning): the dry run's summary is the review.
name: r2prune

on:
  schedule:
    - cron: "23 11 * * 0"           # Sundays 11:23 UTC (the data run is Fridays 03:17 and takes hours)
  workflow_dispatch:
    inputs:
      dry_run:
        description: "only list what would be deleted"
        type: boolean
        default: true
      max_delete_gb:
        description: "refuse to delete more than this many GB in one run"
        default: "500"

permissions:
  contents: read

concurrency:
  group: r2prune
  cancel-in-progress: false

env:
  CODE_REPO: TecnaGamer/BeamNG.Earth

jobs:
  guard:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    outputs:
      floor: ${{ steps.floor.outputs.floor }}
    steps:
      - name: "No other workflow of this repo is running"
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          BUSY=""
          for st in in_progress queued waiting; do
            BUSY="$BUSY$(gh api "repos/$GITHUB_REPOSITORY/actions/runs?status=$st&per_page=100" \
              --jq ".workflow_runs[] | select(.id != $GITHUB_RUN_ID and .name != \"r2prune\") | \"\(.name) #\(.id) (\(.status))\"")"$'\n'
          done
          BUSY=$(printf '%s' "$BUSY" | sed '/^$/d')
          if [ -n "$BUSY" ]; then
            echo "::error::other workflows are running (they write the bucket's prefixes); try again later:"
            echo "$BUSY"
            { echo "### r2prune did not run"; echo; echo "Other workflows were running:"; echo; echo '```'; echo "$BUSY"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
      - id: floor
        name: "The latest released app's Overture RELEASE (text, never run)"
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG=$(gh api "repos/$CODE_REPO/releases/latest" --jq .tag_name)
          [[ "$TAG" =~ ^v[0-9][0-9A-Za-z.+-]{0,63}$ ]] || { echo "::error::odd tag: $TAG"; exit 1; }
          SHA=$(gh api "repos/$CODE_REPO/commits/$TAG" --jq .sha)
          [[ "$SHA" =~ ^[0-9a-f]{40}$ ]]
          for f in server/overturepick.py server/overture.py; do
            code=$(curl -sS -o src.txt -w '%{http_code}' "https://raw.githubusercontent.com/$CODE_REPO/$SHA/$f")
            if [ "$code" = 200 ] && grep -q '^RELEASE = "' src.txt; then break; fi
            rm -f src.txt
          done
          [ -f src.txt ] || { echo "::error::no RELEASE line in $TAG"; exit 1; }
          REL=$(sed -n 's/^RELEASE = "\([0-9]\{4\}-[0-9]\{2\}-[0-9]\{2\}\.[0-9]\{1,3\}\)".*/\1/p' src.txt | head -1)
          [[ "$REL" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}\.[0-9]{1,3}$ ]] || { echo "::error::bad RELEASE in $TAG"; exit 1; }
          echo "$TAG ($SHA): Overture RELEASE $REL" | tee -a "$GITHUB_STEP_SUMMARY"
          echo "floor=$REL" >> "$GITHUB_OUTPUT"

  prune:
    needs: guard
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262   # v4
        with:
          persist-credentials: false
      - name: Unit tests (no secrets in the environment of this step)
        run: python3 -I -m unittest discover -s tests -p test_r2prune.py
      - name: "Plan, and delete only when told to"
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2: https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com
          AWS_REQUEST_CHECKSUM_CALCULATION: when_required     # (see rail.yml's osmtags_publish job)
          AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
          DRY_INPUT: ${{ github.event.inputs.dry_run }}
          MAX_GB: ${{ github.event.inputs.max_delete_gb }}
          FLOOR: ${{ needs.guard.outputs.floor }}
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          MAX_GB=${MAX_GB:-500}
          [[ "$MAX_GB" =~ ^[0-9]{1,4}$ ]] || { echo "::error::max_delete_gb: $MAX_GB"; exit 1; }
          ARGS=(--cdn cdn.json --release-floor "$FLOOR" --max-delete-gb "$MAX_GB")
          # (real deletes: the weekly run, or a dispatch with dry_run false; only on main)
          if [ "$GITHUB_REF" = refs/heads/main ] && { [ "$EVENT" = schedule ] || [ "$DRY_INPUT" = false ]; }; then
            ARGS+=(--delete)
          else
            echo "dry run (event $EVENT, dry_run '${DRY_INPUT:-}', ref $GITHUB_REF)"
          fi
          python3 -I tools/r2prune.py "${ARGS[@]}"
